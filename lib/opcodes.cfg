# Format: NAME HEXCODE
# No prefixes before hexcode

# Name Suffixes:
# - IMM: Immediate
# - ACC: Accumulator
# - IMP: Implied
# - ABS: Absolute
# - ABX: Absolute X indexed
# - ABY: Absolute Y indexed
# - XID: Indexed indirect (X)
# - IDY: Indirect indexed (Y)
# - ZPG: Zero page
# - ZPX: Zero page indexed
# - REL: Relative

